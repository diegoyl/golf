<!DOCTYPE html>
<html lang="en">
  <head>
    <title>Bump Test</title>
    <style>
      body { margin: 0; }
      canvas { display: block; }
    </style>
  </head>
  <body>
    <script type="module">
      import * as THREE from 'three';
      import { OrbitControls } from 'three/examples/jsm/controls/OrbitControls.js';



      /////////////////////////////
      const FILE_NAME = "./bumptest/2test"
      const GRID_W = 2
      const GRID_H = 5
      const SEGMENTS = 1024
      //////////////////////////

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(33, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 5, 0);

      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap; // optional, softer shadows

      document.body.appendChild(renderer.domElement);

      const controls = new OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 0, 0); // roughly center
      controls.update();

      // Lighting
      const light = new THREE.DirectionalLight(0xffffff, 3);
      // light.position.set(3,1,3);
      light.position.set(0,2,0);
      light.castShadow = true;
      scene.add(light);

      // Load bump map
      const textureLoader = new THREE.TextureLoader();
      textureLoader.load(`${FILE_NAME}.png`, (dispMap) => {
        // Plane dimensions (in units): 4 x 2
        const width = GRID_W;  // 2048 px / 512
        const height = GRID_H; // 1024 px / 512

        const geometry = new THREE.PlaneGeometry(width, height, SEGMENTS, SEGMENTS);
        const material = new THREE.MeshStandardMaterial({
          map: dispMap, // show the bump texture visually
          displacementMap: dispMap,
          displacementScale: 0.391,
          // color: 0x33ff77, // lighten this to fade the texture visually
          metalness: 0,
          roughness: 1,
          // wireframe: true,

        });

        // Rotate to make it horizontal
        const plane = new THREE.Mesh(geometry, material);
        plane.rotation.x = -Math.PI / 2;
        plane.receiveShadow = true;
        scene.add(plane);
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      function animate() {
        requestAnimationFrame(animate);
        renderer.render(scene, camera);
      }
      animate();
    </script>
  </body>
</html>
